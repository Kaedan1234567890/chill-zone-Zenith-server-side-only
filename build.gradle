plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.2 is unobfuscated. Loom 1.17 handles the game's official names
    // directly, so DO NOT request officialMojangMappings() here.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LuckPerms-compatible permission bridge (bundled inside this mod jar).
    include(implementation("me.lucko:fabric-permissions-api:0.7.0"))

    // Server-side custom-content bridge for unmodded Java clients.
    include(implementation("eu.pb4:polymer-core:0.17.4+26.2"))
    include(implementation("eu.pb4:polymer-resource-pack:0.17.4+26.2"))
    include(implementation("eu.pb4:polymer-blocks:0.17.4+26.2"))
    include(implementation("eu.pb4:polymer-autohost:0.17.4+26.2"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
